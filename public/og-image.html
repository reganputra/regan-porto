<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Image</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0a0b;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(34,211,238,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.08) 0%, transparent 70%);
    top: -100px;
    right: -100px;
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 80px 100px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }
  .terminal-line {
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    color: #22d3ee;
    letter-spacing: 0.05em;
  }
  h1 {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .subtitle {
    font-family: 'Geist Mono', monospace;
    font-size: 24px;
    color: #22d3ee;
    font-weight: 500;
  }
  .desc {
    font-size: 20px;
    color: #a1a1aa;
    max-width: 700px;
    line-height: 1.5;
  }
  .tags {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .tag {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: #22d3ee;
    background: rgba(34,211,238,0.1);
    border: 1px solid rgba(14,116,144,0.3);
    padding: 6px 14px;
    border-radius: 6px;
  }
  .border-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #22d3ee, transparent);
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="terminal-line">~/regan</div>
    <h1>Regan Putra<br>Ramadhan</h1>
    <div class="subtitle">Backend Engineer</div>
    <div class="desc">Scalable systems, layered architectures, DevOps, and Android development.</div>
    <div class="tags">
      <span class="tag">Go</span>
      <span class="tag">Kotlin</span>
      <span class="tag">Docker</span>
      <span class="tag">PostgreSQL</span>
      <span class="tag">Kubernetes</span>
    </div>
  </div>
  <div class="border-line"></div>
</body>
</html>
