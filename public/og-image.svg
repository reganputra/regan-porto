  <text x="100" y="420" font-family="monospace" font-size="24" font-weight="500" fill="#22d3ee">Backend Engineer</text>

  <text x="100" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#a1a1aa">Scalable systems, layered architectures, DevOps, and Android development.</text>

